name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python, JavaScript and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Isolate Codex test profile
        run: echo "CODEX_HOME=${RUNNER_TEMP}/story-workbench-codex" >> "$GITHUB_ENV"
      - name: Runtime and PDF test dependencies
        run: |
          python3 -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Python tests with simulated providers
        run: |
          python3 -m unittest discover -s scripts
          python3 -m unittest discover -s tests
      - name: JavaScript syntax and audio queue without sound
        run: |
          for file in web/*.js tests/*.js; do node --check "$file"; done
          node tests/pcm_playback_check.js
      - name: Browser test dependencies
        run: |
          python3 -m pip install playwright==1.60.0
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Browser flows with fictional projects
        run: |
          python3 tests/ux_browser_check.py
          python3 tests/modes_browser_check.py
          python3 tests/markdown_browser_check.py
          python3 tests/formats_browser_check.py
          python3 tests/codex_images_browser_check.py
